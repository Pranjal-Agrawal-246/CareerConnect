<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details - JobPortal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">JobPortal</a>
      <div class="nav-links">
        <a href="index.html">Jobs</a>
        <div id="guest-nav">
          <a href="login.html">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </div>
        <div id="user-nav" class="hidden">
          <a href="dashboard.html">Dashboard</a>
          <span id="user-name"></span>
          <a href="#" onclick="auth.logout(); return false;">Logout</a>
        </div>
        <div id="employer-nav" class="hidden">
          <a href="post-job.html" class="btn btn-primary btn-sm">Post a Job</a>
        </div>
        <div id="jobseeker-nav" class="hidden"></div>
      </div>
    </div>
  </nav>

  <div class="job-details container">
    <div id="job-content">
      <div class="text-center"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Apply Modal -->
  <div id="apply-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Apply for this Job</h3>
        <button class="modal-close" onclick="app.closeModal('apply-modal')">&times;</button>
      </div>
      <form id="apply-form">
        <div class="form-group">
          <label for="coverLetter">Cover Letter</label>
          <textarea id="coverLetter" name="coverLetter" class="form-control" rows="6" placeholder="Tell the employer why you're a great fit..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Application</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentJobId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      currentJobId = app.getUrlParam('id');
      if (!currentJobId) {
        window.location.href = 'index.html';
        return;
      }
      
      await loadJob();
    });

    async function loadJob() {
      try {
        const job = await jobs.loadJobDetails(currentJobId);
        
        const salaryText = job.salary?.min && job.salary?.max
          ? `${job.salary.currency} ${job.salary.min.toLocaleString()} - ${job.salary.max.toLocaleString()}`
          : 'Not specified';

        document.getElementById('job-content').innerHTML = `
          <div class="job-header">
            <div class="card-header">
              <div>
                <h1 class="job-title">${jobs.escapeHtml(job.title)}</h1>
                <p class="company" style="font-size: 1.1rem;">${jobs.escapeHtml(job.company)}</p>
              </div>
              <span class="badge badge-primary">${job.jobType}</span>
            </div>
            <div class="job-meta mt-2">
              <span>📍 ${jobs.escapeHtml(job.location)}</span>
              <span>💼 ${job.experience} level</span>
              <span>💰 ${salaryText}</span>
              <span>📅 Posted ${app.formatDate(job.createdAt)}</span>
            </div>
            ${job.deadline ? `<p class="mt-1">⏰ Apply by ${app.formatDate(job.deadline)}</p>` : ''}
            <div class="mt-2" id="apply-section">
              ${renderApplyButton()}
            </div>
          </div>

          <div class="job-body">
            <h3>Job Description</h3>
            <div style="white-space: pre-wrap;">${jobs.escapeHtml(job.description)}</div>

            ${job.skills?.length ? `
              <h3>Required Skills</h3>
              <div class="job-tags">
                ${job.skills.map(skill => `<span class="tag">${jobs.escapeHtml(skill)}</span>`).join('')}
              </div>
            ` : ''}

            <h3>About the Company</h3>
            <p><strong>${jobs.escapeHtml(job.company)}</strong></p>
            <p>Contact: ${job.employer?.email || 'Not available'}</p>
          </div>
        `;
      } catch (error) {
        document.getElementById('job-content').innerHTML = `
          <div class="alert alert-danger">${error.message}</div>
          <a href="index.html" class="btn btn-secondary">Back to Jobs</a>
        `;
      }
    }

    function renderApplyButton() {
      if (!auth.isLoggedIn()) {
        return '<a href="login.html" class="btn btn-primary">Login to Apply</a>';
      }
      if (auth.isEmployer()) {
        return '<p class="card-subtitle">Employers cannot apply for jobs</p>';
      }
      return '<button class="btn btn-primary btn-success" onclick="app.openModal(\'apply-modal\')">Apply Now</button>';
    }

    app.handleForm('apply-form', async (data) => {
      try {
        await api.applications.apply(currentJobId, data);
        app.closeModal('apply-modal');
        app.showAlert('Application submitted successfully!', 'success');
        document.getElementById('apply-section').innerHTML = '<p class="badge badge-success">Applied ✓</p>';
      } catch (error) {
        throw error;
      }
    });
  </script>
</body>
</html>
