<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - JobPortal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">JobPortal</a>
    </div>
  </nav>

  <div class="auth-container">
    <h2>Create Account</h2>
    <form id="register-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="role">I am a</label>
        <select id="role" name="role" class="form-control" required onchange="toggleRoleFields()">
          <option value="jobseeker">Job Seeker</option>
          <option value="employer">Employer</option>
        </select>
      </div>
      
      <!-- Employer Fields -->
      <div id="employer-fields" class="hidden">
        <div class="form-group">
          <label for="company">Company Name</label>
          <input type="text" id="company" name="company" class="form-control">
        </div>
      </div>
      
      <!-- Jobseeker Fields -->
      <div id="jobseeker-fields">
        <div class="form-group">
          <label for="skills">Skills (comma separated)</label>
          <input type="text" id="skills" name="skills" class="form-control" placeholder="JavaScript, React, Node.js">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
      <div class="form-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function toggleRoleFields() {
      const role = document.getElementById('role').value;
      document.getElementById('employer-fields').classList.toggle('hidden', role !== 'employer');
      document.getElementById('jobseeker-fields').classList.toggle('hidden', role !== 'jobseeker');
    }

    app.handleForm('register-form', async (data) => {
      // Process skills
      if (data.skills) {
        data.skills = data.skills.split(',').map(s => s.trim()).filter(s => s);
      }
      
      const response = await api.auth.register(data);
      auth.login(response.token, response.user);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
