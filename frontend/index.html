<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobPortal - Find Your Dream Job</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">JobPortal</a>
      <div class="nav-links">
        <a href="index.html">Jobs</a>
        
        <!-- Guest Navigation -->
        <div id="guest-nav">
          <a href="login.html">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </div>
        
        <!-- User Navigation -->
        <div id="user-nav" class="hidden">
          <a href="dashboard.html">Dashboard</a>
          <span id="user-name"></span>
          <a href="#" onclick="auth.logout(); return false;">Logout</a>
        </div>
        
        <!-- Employer Nav -->
        <div id="employer-nav" class="hidden">
          <a href="post-job.html" class="btn btn-primary btn-sm">Post a Job</a>
        </div>
        
        <!-- Jobseeker Nav -->
        <div id="jobseeker-nav" class="hidden"></div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Find Your Dream Job Today</h1>
      <p>Thousands of jobs from top companies waiting for you</p>
    </div>
  </section>

  <!-- Search Box -->
  <div class="container">
    <div class="search-box">
      <input type="text" id="search-input" class="form-control" placeholder="Job title, keywords, or company">
      <select id="job-type" class="form-control">
        <option value="">All Job Types</option>
        <option value="full-time">Full Time</option>
        <option value="part-time">Part Time</option>
        <option value="contract">Contract</option>
        <option value="internship">Internship</option>
        <option value="remote">Remote</option>
      </select>
      <select id="experience" class="form-control">
        <option value="">All Experience</option>
        <option value="entry">Entry Level</option>
        <option value="mid">Mid Level</option>
        <option value="senior">Senior Level</option>
        <option value="lead">Lead</option>
      </select>
      <button class="btn btn-primary" onclick="searchJobs()">Search</button>
    </div>
  </div>

  <!-- Jobs List -->
  <section class="container mt-3">
    <h2 class="mb-2">Latest Jobs</h2>
    <div id="jobs-container" class="grid grid-2">
      <!-- Jobs will be loaded here -->
    </div>
    <div id="pagination" class="pagination"></div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Load jobs on page load
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('jobs-container');
      jobs.loadJobs(container);
    });

    // Search function
    function searchJobs() {
      const search = document.getElementById('search-input').value;
      const jobType = document.getElementById('job-type').value;
      const experience = document.getElementById('experience').value;

      const filters = {};
      if (search) filters.search = search;
      if (jobType) filters.jobType = jobType;
      if (experience) filters.experience = experience;

      jobs.search(filters);
    }

    // Search on Enter key
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchJobs();
    });
  </script>
</body>
</html>
